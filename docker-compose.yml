services:
  nexusai:
    build: .
    container_name: nexusai
    restart: unless-stopped
    ports:
      - "3011:3011"
    environment:
      # ─── Core ───
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - HOSTNAME=0.0.0.0
      - PORT=3011

      # ─── Auth Mode ───
      # Set to "logto" for production (requires Logto credentials)
      # Set to "demo" for testing without auth
      - AUTH_MODE=${AUTH_MODE:-demo}

      # ─── Logto Authentication ───
      - LOGTO_ENDPOINT=${LOGTO_ENDPOINT:-}
      - LOGTO_APP_ID=${LOGTO_APP_ID:-}
      - LOGTO_APP_SECRET=${LOGTO_APP_SECRET:-}
      - LOGTO_BASE_URL=${LOGTO_BASE_URL:-}
      - LOGTO_COOKIE_SECRET=${LOGTO_COOKIE_SECRET:-}

      # ─── Encryption ───
      # Generate with: openssl rand -hex 32
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}

      # ─── Directus (optional — Phase 1.2 POC only) ───
      - DIRECTUS_URL=${DIRECTUS_URL:-}
      - DIRECTUS_SERVICE_TOKEN=${DIRECTUS_SERVICE_TOKEN:-}
